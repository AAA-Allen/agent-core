[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.2.0"
description = "Domain-neutral agent workflow runtime: ordered steps, fail-closed decision boundaries, tool capability gating, structured run persistence, and an optional HTTP workbench."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
agent-core-server = "agent_core.server:main"

[tool.setuptools]
packages = ["agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
